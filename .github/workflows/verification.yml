name: Verification

on:
  push:
    branches: [main, 'feat/**']
    paths: ['api/**', 'app/**', 'deploy/**', 'test/**', 'go.mod', 'go.sum', '.github/workflows/**']
  pull_request:
    paths: ['api/**', 'app/**', 'deploy/**', 'test/**', 'go.mod', 'go.sum', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOMEMLIMIT: '512MiB'

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Verify dependencies and generation
        run: |
          go mod download
          go mod verify
          go generate ./api/...
          git diff --exit-code -- api
      - name: Unit, architecture and race gates
        run: |
          go vet -p 2 ./...
          go test -race -p 2 ./...

  authority-gates:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    # Separate existing storage/HTTP and executable gates without concurrent
    # databases or a larger per-runner budget. No test deadline is changed.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane: [authority-storage, authority-runtime]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_PASSWORD: matrix-authority-ci-test-only
        ports:
          - 5432
        options: >-
          --cpus 1 --memory 768m --pids-limit 192
          --label matrix.task=iam-authority-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Retained-data upgrade gates read fixed, accepted Git objects.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Create independent gate databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          AUTHORITY_LANE: ${{ matrix.lane }}
          AUTHORITY_RUN: ${{ github.run_id }}_${{ github.run_attempt }}
          AUTHORITY_LABEL: iam-authority-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels "matrix.task" }}' "$POSTGRES_CONTAINER_ID")" = "$AUTHORITY_LABEL"
          case "$AUTHORITY_LANE" in
            authority-storage)
              databases=(matrix_authority_ci matrix_audit_upgrade_ci matrix_audit_http_ci
                matrix_iam_http_ci matrix_iam_policy_ci matrix_iam_recovery_ci matrix_iam_attachment_ci
                matrix_iam_roles_ci matrix_iam_references_ci matrix_iam_role_sessions_ci matrix_iam_role_discovery_ci
                matrix_iam_role_management_ci matrix_iam_role_authorization_ci matrix_iam_role_security_ci matrix_iam_access_keys_ci matrix_paas_ci)
              ;;
            authority-runtime)
              databases=(matrix_iam_own_session_ci matrix_iam_own_session_expiry_ci matrix_iam_own_session_bulk_ci
                matrix_iam_upgrade_compiled_ci matrix_iam_upgrade_roles_ci matrix_iam_upgrade_role_authority_ci
                matrix_iam_upgrade_own_session_ci matrix_authority_process_ci matrix_authority_process_capacity_ci)
              ;;
            *) exit 1 ;;
          esac
          for database in "${databases[@]}"; do
            docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres "${database}_${AUTHORITY_RUN}"
          done
      - name: Verify published installer rejects new schema format before effects
        if: matrix.lane == 'authority-runtime'
        run: |
          legacy_source="$(mktemp -d "$RUNNER_TEMP/matrix-published-installer-XXXXXX")"
          git archive c88a84f379afcf94431e2aca7332fe6ec3136dc7 | tar -x -C "$legacy_source"
          (cd "$legacy_source" && go build -p 2 -trimpath -o "$RUNNER_TEMP/mx-phase1" ./app/service/installation/cmd/mx)
          MATRIX_INSTALLATION_LEGACY_MX_BINARY="$RUNNER_TEMP/mx-phase1" \
            go test -p 1 -count=1 ./app/service/installation/internal/platformcommand \
              -run '^TestPublishedExecutableRejectsNewManifestBeforeEffects$'
      # Unpublished IAM development revisions are not production upgrade
      # baselines. Fixed IAM21 document interpretation and R1 USER-only
      # compilations, R2 role evidence and accepted IAM31 self completions prove
      # the distinct FEAT005/006/009 boundaries, not release upgrade admission.
      # Other historical-binary diagnostics stay opt-in.
      - name: PostgreSQL authority storage and HTTP gates
        if: matrix.lane == 'authority-storage'
        env:
          MATRIX_AUTHORITY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_authority_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_AUDIT_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_audit_upgrade_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_AUDIT_HTTP_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_audit_http_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_HTTP_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_http_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_POLICY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_policy_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_RECOVERY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_recovery_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ATTACHMENT_SESSION_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_attachment_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ROLE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_roles_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ROLE_SESSION_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_role_sessions_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ROLE_DISCOVERY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_role_discovery_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ROLE_MANAGEMENT_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_role_management_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ROLE_AUTHORIZATION_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_role_authorization_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ROLE_SECURITY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_role_security_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_MANAGEMENT_REFERENCE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_references_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ACCESS_KEY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_access_keys_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_PAAS_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_paas_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
        run: |
          time go test -race -p 1 -count=1 ./app/service/audit/internal/data/postgres \
            ./app/service/audit/internal/integration
          # Discover compiled tests so a new storage fixture is not silently
          # omitted. Each runs serially with its original context/lock deadline
          # and Go's default timer; unrelated fixtures do not share that timer.
          iam_tests="$(go test -race -p 1 -list '^Test' ./app/service/iam/internal/integration)"
          iam_storage_count=0
          while IFS= read -r iam_test; do
            [[ "$iam_test" =~ ^Test[A-Za-z0-9_]+$ ]] || continue
            case "$iam_test" in
              TestIAMRoleAndManagementReferencesPostgres|TestIAMOwnSessionPostgres|TestIAMOwnSessionExpiryPostgres|TestIAMOwnSessionBulkPostgres) continue ;;
            esac
            printf 'IAM fixture: %s\n' "$iam_test"
            time go test -race -p 1 -count=1 ./app/service/iam/internal/integration -run "^${iam_test}$"
            iam_storage_count=$((iam_storage_count + 1))
          done <<< "$iam_tests"
          test "$iam_storage_count" -gt 0
          time go test -race -p 1 -count=1 ./app/service/iam/internal/integration \
            -run '^TestIAMRoleAndManagementReferencesPostgres$'
          time go test -race -p 1 -count=1 ./app/service/paas/internal/apphosting/data/postgres
      - name: Own login sessions and post-lock expiry
        if: matrix.lane == 'authority-runtime'
        env:
          MATRIX_IAM_OWN_SESSION_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_own_session_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_OWN_SESSION_EXPIRY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_own_session_expiry_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_OWN_SESSION_BULK_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_own_session_bulk_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
        # Existing tests retain their databases/deadlines. Bulk reduction adds
        # one isolated fixture within the same two serial twenty-minute lanes;
        # no existing scenario or password cost is reduced.
        run: |
          time go test -race -p 1 -count=1 ./app/service/iam/internal/integration \
            -run '^TestIAMOwnSession(Postgres|ExpiryPostgres|BulkPostgres)$'
      - name: Retained data and actual authority processes
        if: matrix.lane == 'authority-runtime'
        env:
          MATRIX_IAM_POLICY_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_upgrade_compiled_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ROLE_PROFILE_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_upgrade_roles_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_ROLE_AUTHORITY_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_upgrade_role_authority_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_IAM_OWN_SESSION_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_iam_upgrade_own_session_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
          MATRIX_AUTHORITY_PROCESS_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/matrix_authority_process_ci_${{ github.run_id }}_${{ github.run_attempt }}?sslmode=disable
        run: time go test -race -p 1 -count=1 ./test/authorityprocess

      - name: Bounded IAM HTTP and PostgreSQL capacity observation
        if: matrix.lane == 'authority-runtime'
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          AUTHORITY_LABEL: iam-authority-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          CAPACITY_RUN: ${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels "matrix.task" }}' "$POSTGRES_CONTAINER_ID")" = "$AUTHORITY_LABEL"
          mapfile -t networks < <(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' "$POSTGRES_CONTAINER_ID" | sed '/^$/d')
          test "${#networks[@]}" = 1
          # Actions registers the service label as the network alias. Its
          # generated container name can exceed a DNS label's length limit.
          postgres_host=postgres
          test "$(docker inspect --format '{{range .NetworkSettings.Networks}}{{range .Aliases}}{{println .}}{{end}}{{end}}' "$POSTGRES_CONTAINER_ID" | grep -Fxc -- "$postgres_host")" = 1
          capacity_name="matrix-iam-capacity-${CAPACITY_RUN}"
          capacity_cache="${capacity_name}-build"
          capacity_source="$RUNNER_TEMP/${capacity_name}-source.tar"
          cleanup_capacity() {
            if docker inspect "$capacity_name" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{ index .Config.Labels "matrix.task" }}' "$capacity_name")" = "$AUTHORITY_LABEL" || return 1
              docker rm --force "$capacity_name"
            fi
            if docker volume inspect "$capacity_cache" >/dev/null 2>&1; then
              test "$(docker volume inspect --format '{{ index .Labels "matrix.task" }}' "$capacity_cache")" = "$AUTHORITY_LABEL" || return 1
              docker volume rm "$capacity_cache"
            fi
          }
          trap cleanup_capacity EXIT
          # The exact tracked source, without a foreign-owned .git directory
          # or machine-local edits, is also the local measurement boundary.
          test ! -e "$capacity_source"
          git archive --format=tar --output="$capacity_source" HEAD
          docker volume create --label "matrix.task=$AUTHORITY_LABEL" --label matrix.slice=iam-capacity "$capacity_cache"
          export MATRIX_IAM_CAPACITY_POSTGRES_TEST_DSN="postgres://postgres:matrix-authority-ci-test-only@${postgres_host}:5432/matrix_authority_process_capacity_ci_${CAPACITY_RUN}?sslmode=disable"
          docker run --rm --name "$capacity_name" --label "matrix.task=$AUTHORITY_LABEL" --label matrix.slice=iam-capacity \
            --cpus 2 --memory 1536m --memory-swap 1536m --pids-limit 256 --cgroupns private --network "${networks[0]}" \
            --mount "type=bind,source=$capacity_source,target=/source.tar,readonly" \
            --mount "type=bind,source=$(go env GOMODCACHE),target=/modules,readonly" \
            --mount "type=volume,source=$capacity_cache,target=/cache" \
            -e GOMAXPROCS=2 -e GOMEMLIMIT=512MiB -e GOCACHE=/cache -e GOMODCACHE=/modules \
            -e MATRIX_IAM_CAPACITY_POSTGRES_TEST_DSN \
            golang@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651 \
            sh -c 'mkdir /work && tar -xf /source.tar -C /work && cd /work && go test -race -p 1 -count=1 -v ./test/authorityprocess -run "^TestIAMCapacityProcesses$"'

  authority-process:
    # Preserve the branch-protection check. The matrix result is success only
    # when BOTH named lanes succeeded; failure/cancellation/skip must close it.
    needs: authority-gates
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every authority lane to succeed
        env:
          AUTHORITY_RESULT: ${{ needs.authority-gates.result }}
        run: test "$AUTHORITY_RESULT" = success

  node-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_EXPORTER_VERSION: '1.12.1'
      NODE_EXPORTER_SHA256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Prepare the isolated runner's local Docker prerequisites
        run: |
          sudo timeout 30s systemctl start docker
          sudo env -u DOCKER_CONTEXT DOCKER_HOST=unix:///var/run/docker.sock \
            timeout 30s docker info --format '{{.ServerVersion}}'
          sudo timeout 10s docker compose version --short
      - name: Fetch authenticated collector fixture
        run: |
          curl --fail --location --proto '=https' --tlsv1.3 --max-time 90 \
            -o "$RUNNER_TEMP/node_exporter.tar.gz" \
            "https://github.com/prometheus/node_exporter/releases/download/v$NODE_EXPORTER_VERSION/node_exporter-$NODE_EXPORTER_VERSION.linux-amd64.tar.gz"
          echo "$NODE_EXPORTER_SHA256  $RUNNER_TEMP/node_exporter.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/node_exporter.tar.gz" -C "$RUNNER_TEMP" --no-same-owner \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/node_exporter" \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/LICENSE" \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/NOTICE"
      - name: Build and verify the real Linux node and collector processes
        env:
          MATRIX_NODE_AGENT_REAL_RUNTIME: '1'
          MATRIX_NODE_AGENT_BINARY: ${{ runner.temp }}/matrix-node-agent
        run: |
          go build -p 2 -trimpath -o "$MATRIX_NODE_AGENT_BINARY" ./app/service/nodeagent/cmd/matrix-node-agent
          go test -c -p 2 -o "$RUNNER_TEMP/node-runtime.test" ./app/service/nodeagent/internal/service/nethttp
          sudo env GOMAXPROCS=2 MATRIX_NODE_AGENT_REAL_RUNTIME=1 \
            "MATRIX_NODE_AGENT_BINARY=$MATRIX_NODE_AGENT_BINARY" \
            "MATRIX_NODE_EXPORTER_BINARY=$RUNNER_TEMP/node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/node_exporter" \
            "$RUNNER_TEMP/node-runtime.test" -test.v -test.count=1 -test.timeout=90s -test.run='^TestLinuxNodeProcessObservation$'
