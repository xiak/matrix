name: Verification

on:
  push:
    branches: [main, 'feat/**']
    paths: ['api/**', 'app/**', 'deploy/**', 'test/**', 'go.mod', 'go.sum', '.github/workflows/**']
  pull_request:
    paths: ['api/**', 'app/**', 'deploy/**', 'test/**', 'go.mod', 'go.sum', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOMEMLIMIT: '512MiB'

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Verify dependencies and generation
        run: |
          go mod download
          go mod verify
          go generate ./api/...
          git diff --exit-code -- api
      - name: Unit, architecture and race gates
        run: |
          go vet -p 2 ./...
          go test -race -p 2 ./...

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/ui/paas/_frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: app/ui/paas/_frontend/package-lock.json
      - name: Verify control-plane UI behavior and embedded export
        run: |
          npm ci
          npm run check

  authority-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_PASSWORD: matrix-authority-ci-test-only
        ports:
          - 5432
        options: >-
          --cpus 1 --memory 768m --pids-limit 192
          --label matrix.task=matrix-authority-${{ github.run_id }}-${{ github.run_attempt }}
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Retained-data upgrade gates read fixed, accepted Git objects.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Create independent gate databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          for database in matrix_authority_ci matrix_audit_upgrade_ci matrix_audit_http_ci \
              matrix_iam_http_ci matrix_iam_recovery_ci matrix_iam_upgrade_ci matrix_iam_upgrade_sessions_ci \
              matrix_iam_upgrade_local_recovery_ci matrix_iam_upgrade_pre_platform_ci \
              matrix_iam_password_attempts_ci matrix_iam_totp_custody_ci matrix_iam_totp_backup_ci \
              matrix_iam_totp_backup_process_ci \
              matrix_authority_process_ci matrix_paas_ci matrix_paas_upgrade_ci \
              matrix_paas_runtime_compat_ci; do
            docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres "$database"
          done
      - name: Verify published installer rejects new schema format before effects
        run: |
          legacy_source="$(mktemp -d "$RUNNER_TEMP/matrix-published-installer-XXXXXX")"
          git archive c88a84f379afcf94431e2aca7332fe6ec3136dc7 | tar -x -C "$legacy_source"
          (cd "$legacy_source" && go build -p 2 -trimpath -o "$RUNNER_TEMP/mx-phase1" ./app/service/installation/cmd/mx)
          MATRIX_INSTALLATION_LEGACY_MX_BINARY="$RUNNER_TEMP/mx-phase1" \
            go test -p 1 -count=1 ./app/service/installation/internal/platformcommand \
              -run '^TestPublishedExecutableRejectsNewManifestBeforeEffects$'
      - name: PostgreSQL authority, retained-data upgrade and independent-process gates
        env:
          MATRIX_AUTHORITY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_authority_ci?sslmode=disable
          MATRIX_AUDIT_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_audit_upgrade_ci?sslmode=disable
          MATRIX_AUDIT_HTTP_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_audit_http_ci?sslmode=disable
          MATRIX_IAM_HTTP_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_http_ci?sslmode=disable
          MATRIX_IAM_RECOVERY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_recovery_ci?sslmode=disable
          MATRIX_IAM_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_upgrade_ci?sslmode=disable
          MATRIX_IAM_PRE_PLATFORM_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_upgrade_pre_platform_ci?sslmode=disable
          MATRIX_IAM_SESSION_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_upgrade_sessions_ci?sslmode=disable
          MATRIX_IAM_LOCAL_RECOVERY_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_upgrade_local_recovery_ci?sslmode=disable
          MATRIX_IAM_PASSWORD_ATTEMPTS_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_password_attempts_ci?sslmode=disable
          MATRIX_IAM_TOTP_CUSTODY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_totp_custody_ci?sslmode=disable
          MATRIX_IAM_TOTP_BACKUP_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_totp_backup_ci?sslmode=disable
          MATRIX_IAM_TOTP_BACKUP_PROCESS_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_totp_backup_process_ci?sslmode=disable
          MATRIX_IAM_BACKUP_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MATRIX_IAM_BACKUP_POSTGRES_TASK: matrix-authority-${{ github.run_id }}-${{ github.run_attempt }}
          MATRIX_AUTHORITY_PROCESS_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_authority_process_ci?sslmode=disable
          MATRIX_PAAS_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_paas_ci?sslmode=disable
          MATRIX_PAAS_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_paas_upgrade_ci?sslmode=disable
          MATRIX_PAAS_RUNTIME_COMPAT_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_paas_runtime_compat_ci?sslmode=disable
        run: |
          go test -race -p 1 -count=1 ./app/service/audit/internal/data/postgres \
            ./app/service/audit/internal/integration ./app/service/iam/internal/integration \
            ./test/authorityprocess ./app/service/paas/internal/apphosting/data/postgres

  node-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_EXPORTER_VERSION: '1.12.1'
      NODE_EXPORTER_SHA256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
    services:
      postgres:
        image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_PASSWORD: matrix-node-authority-ci-test-only
        ports:
          - 5432
        options: >-
          --cpus 1 --memory 768m --pids-limit 192
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The native gate uses the actual fixed runtime-5 predecessor. Older
          # runtime contracts remain unsupported before effects.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Prepare the isolated runner's local Docker prerequisites
        run: |
          sudo timeout 30s systemctl start docker
          sudo env -u DOCKER_CONTEXT DOCKER_HOST=unix:///var/run/docker.sock \
            timeout 30s docker info --format '{{.ServerVersion}}'
          sudo timeout 10s docker compose version --short
      - name: Verify structured deployment telemetry against the real Docker Engine
        env:
          MATRIX_COMPOSE_E2E: '1'
        run: |
          GOMAXPROCS=2 timeout 150s go test -p 1 -count=1 -timeout=140s \
            -run='^TestRealComposeExecutorOfflineVerticalSlice$' \
            ./app/adapter/apphosting/compose
      - name: Fetch authenticated collector fixture
        run: |
          curl --fail --location --proto '=https' --tlsv1.3 --max-time 90 \
            -o "$RUNNER_TEMP/node_exporter.tar.gz" \
            "https://github.com/prometheus/node_exporter/releases/download/v$NODE_EXPORTER_VERSION/node_exporter-$NODE_EXPORTER_VERSION.linux-amd64.tar.gz"
          echo "$NODE_EXPORTER_SHA256  $RUNNER_TEMP/node_exporter.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/node_exporter.tar.gz" -C "$RUNNER_TEMP" --no-same-owner \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/node_exporter" \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/LICENSE" \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/NOTICE"
      - name: Build and verify the real Linux node and collector processes
        env:
          MATRIX_NODE_AGENT_REAL_RUNTIME: '1'
          MATRIX_NODE_AGENT_BINARY: ${{ runner.temp }}/matrix-node-agent
        run: |
          go build -p 2 -trimpath -o "$MATRIX_NODE_AGENT_BINARY" ./app/service/nodeagent/cmd/matrix-node-agent
          go test -c -p 2 -o "$RUNNER_TEMP/node-runtime.test" ./app/service/nodeagent/internal/service/nethttp
          sudo env GOMAXPROCS=2 MATRIX_NODE_AGENT_REAL_RUNTIME=1 \
            "MATRIX_NODE_AGENT_BINARY=$MATRIX_NODE_AGENT_BINARY" \
            "MATRIX_NODE_EXPORTER_BINARY=$RUNNER_TEMP/node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/node_exporter" \
            "$RUNNER_TEMP/node-runtime.test" -test.v -test.count=1 -test.timeout=90s -test.run='^TestLinuxNodeProcessObservation$'
      - name: Verify signed native startup, upgrade, rollback and interrupted replay
        run: |
          previous_node_source="$(mktemp -d "$RUNNER_TEMP/matrix-node-predecessor-XXXXXX")"
          git worktree add --detach "$previous_node_source" a25d4468927e121ee800f851c96b605a3c010e6e
          go run -p 2 ./deploy/cmd/matrix-release keygen --key-id node-ci \
            --private-key "$RUNNER_TEMP/node-release-private.json" --trust-key "$RUNNER_TEMP/node-release-trust.json"
          (
            cd "$previous_node_source"
            go run -p 2 ./deploy/cmd/matrix-release assemble --target node --repository "$previous_node_source" \
              --collector-archive "$RUNNER_TEMP/node_exporter.tar.gz" --output "$RUNNER_TEMP/node-release" \
              --version v0.3.0-node.1 --build-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --private-key "$RUNNER_TEMP/node-release-private.json" --trust-key "$RUNNER_TEMP/node-release-trust.json"
          )
          go run -p 2 ./deploy/cmd/matrix-release assemble --target node --repository "$GITHUB_WORKSPACE" \
            --collector-archive "$RUNNER_TEMP/node_exporter.tar.gz" --output "$RUNNER_TEMP/node-release-b" \
            --version v0.3.0-node.2 --build-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-successor" \
            --previous-id matrix-v0.3.0-node.1-a25d4468927e --previous-version v0.3.0-node.1 \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --private-key "$RUNNER_TEMP/node-release-private.json" --trust-key "$RUNNER_TEMP/node-release-trust.json"
          node_gate_root="$(sudo mktemp -d /opt/matrix-node-ci-XXXXXX)"
          trap 'sudo rmdir "$node_gate_root"' EXIT
          sudo systemd-run --wait --pipe --collect \
            --unit="matrix-node-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=CPUQuota=100% --property=MemoryMax=768M --property=TasksMax=128 \
            --property=RuntimeMaxSec=360 --property=IPAddressDeny=any --property=IPAddressAllow=localhost \
            /usr/bin/env GOMAXPROCS=2 GOMEMLIMIT=512MiB "TMPDIR=$node_gate_root" \
            MATRIX_NODE_INSTALLATION_REAL_RUNTIME=1 \
            "MATRIX_NODE_RELEASE_BUNDLE=$RUNNER_TEMP/node-release" \
            "MATRIX_NODE_UPGRADE_BUNDLE=$RUNNER_TEMP/node-release-b" \
            "MATRIX_NODE_RELEASE_TRUST=$RUNNER_TEMP/node-release-trust.json" \
            "$RUNNER_TEMP/node-runtime.test" -test.v -test.count=1 -test.timeout=330s -test.run='^TestLinuxSignedNodeStartup$'
      - name: Verify current signed node self-enrollment
        run: |
          go run -p 2 ./deploy/cmd/matrix-release assemble --target node --repository "$GITHUB_WORKSPACE" \
            --collector-archive "$RUNNER_TEMP/node_exporter.tar.gz" --output "$RUNNER_TEMP/node-release-self-enrollment" \
            --version v0.3.0-node.3 --build-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-self-enrollment" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --private-key "$RUNNER_TEMP/node-release-private.json" --trust-key "$RUNNER_TEMP/node-release-trust.json"
          self_enrollment_gate_root="$(sudo mktemp -d /opt/matrix-node-enrollment-ci-XXXXXX)"
          trap 'sudo rmdir "$self_enrollment_gate_root"' EXIT
          sudo systemd-run --wait --pipe --collect \
            --unit="matrix-node-enrollment-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --property=CPUQuota=100% --property=MemoryMax=768M --property=TasksMax=128 \
            --property=RuntimeMaxSec=180 --property=IPAddressDeny=any \
            --property=IPAddressAllow=localhost --property=IPAddressAllow=10.0.0.0/8 \
            --property=IPAddressAllow=172.16.0.0/12 --property=IPAddressAllow=192.168.0.0/16 \
            /usr/bin/env GOMAXPROCS=2 GOMEMLIMIT=512MiB "TMPDIR=$self_enrollment_gate_root" \
            MATRIX_NODE_SELF_ENROLLMENT_REAL_RUNTIME=1 \
            "MATRIX_NODE_SELF_ENROLLMENT_BUNDLE=$RUNNER_TEMP/node-release-self-enrollment" \
            "MATRIX_NODE_RELEASE_TRUST=$RUNNER_TEMP/node-release-trust.json" \
            "$RUNNER_TEMP/node-runtime.test" -test.v -test.count=1 -test.timeout=150s -test.run='^TestLinuxCurrentNodeSelfEnrollment$'
      - name: Verify the real node through independent platform authorities
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          MATRIX_NODE_AUTHORITY_PROCESS_POSTGRES_TEST_DSN: postgres://postgres:matrix-node-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_authority_process_node_ci?sslmode=disable
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres matrix_authority_process_node_ci
          go build -p 2 -trimpath -o "$RUNNER_TEMP/" \
            ./app/service/iam/cmd/matrix-iam ./app/service/iam/cmd/matrix-iam-audit-dispatcher \
            ./app/service/iam/cmd/matrix-iam-local-recovery \
            ./app/service/audit/cmd/matrix-audit ./app/service/paas/cmd/matrix-paas \
            ./app/service/paas/cmd/matrix-paas-audit-dispatcher
          go test -c -p 2 -o "$RUNNER_TEMP/authority-process.test" ./test/authorityprocess
          sudo env GOMAXPROCS=2 GOMEMLIMIT=512MiB \
            "MATRIX_AUTHORITY_PROCESS_BINARY_DIR=$RUNNER_TEMP" \
            "MATRIX_NODE_AGENT_BINARY=$RUNNER_TEMP/matrix-node-agent" \
            "MATRIX_NODE_EXPORTER_BINARY=$RUNNER_TEMP/node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/node_exporter" \
            "MATRIX_NODE_AUTHORITY_PROCESS_POSTGRES_TEST_DSN=$MATRIX_NODE_AUTHORITY_PROCESS_POSTGRES_TEST_DSN" \
            "$RUNNER_TEMP/authority-process.test" -test.v -test.count=1 -test.timeout=180s -test.run='^TestLinuxNodeAuthorityProcesses$'

  platform-release:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/phase3-mfa-recovery')
    needs: [go, ui, authority-process, node-process]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLATFORM_DIND: matrix-platform-release-${{ github.run_id }}-${{ github.run_attempt }}
      PLATFORM_DATA_VOLUME: matrix-platform-data-${{ github.run_id }}-${{ github.run_attempt }}
      PLATFORM_DOCKER_VOLUME: matrix-platform-docker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Set up manifest-aware Docker image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v28.0.4
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Prepare fixed release build inputs
        run: |
          timeout 30s docker info --format '{{.ServerVersion}}'
          docker pull apache/apisix@sha256:6cbf65f3085d1386bfd636b7e88400c163c3641841909e674af7896a5766b092
          docker pull alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          docker pull docker@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
          docker pull postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
          docker image tag apache/apisix@sha256:6cbf65f3085d1386bfd636b7e88400c163c3641841909e674af7896a5766b092 apache/apisix:3.17.0-debian
          docker image tag alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b alpine:3.24.1
          docker image tag docker@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce docker:27.5.1-dind-alpine3.21
          docker image tag postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a postgres:18
          verify_image() {
            actual="$(docker image inspect "$1" --format '{{.Id}}')"
            printf '%s %s\n' "$1" "$actual"
            test "$actual" = "$2"
          }
          verify_image apache/apisix:3.17.0-debian sha256:6cbf65f3085d1386bfd636b7e88400c163c3641841909e674af7896a5766b092
          verify_image alpine:3.24.1 sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          verify_image docker:27.5.1-dind-alpine3.21 sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
          verify_image postgres:18 sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
          df -h "$RUNNER_TEMP" /var/lib/docker
      - name: Assemble authenticated predecessor and preparation releases
        run: |
          predecessor_source="$RUNNER_TEMP/matrix-platform-predecessor"
          git worktree add --detach "$predecessor_source" 9815916b8bf8ae5505a6bc96681dd92fe92f945c
          go run -p 2 ./deploy/cmd/matrix-release keygen --key-id platform-ci \
            --private-key "$RUNNER_TEMP/platform-release-private.json" \
            --trust-key "$RUNNER_TEMP/platform-release-trust.json"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (
            cd "$predecessor_source"
            go run -p 2 ./deploy/cmd/matrix-release assemble --target platform \
              --repository "$predecessor_source" --output "$RUNNER_TEMP/platform-release-a" \
              --version v0.4.0-preparation.1 --build-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-a" \
              --created-at "$created_at" --private-key "$RUNNER_TEMP/platform-release-private.json" \
              --trust-key "$RUNNER_TEMP/platform-release-trust.json"
          )
          release_a_id="$(jq -er '.release.id' "$RUNNER_TEMP/platform-release-a/release.json")"
          go run -p 2 ./deploy/cmd/matrix-release assemble --target platform \
            --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/platform-release-b" \
            --version v0.4.0-preparation.2 --build-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-b" \
            --previous-id "$release_a_id" --previous-version v0.4.0-preparation.1 \
            --created-at "$created_at" --private-key "$RUNNER_TEMP/platform-release-private.json" \
            --trust-key "$RUNNER_TEMP/platform-release-trust.json"
          CGO_ENABLED=0 go test -c -p 2 -o "$RUNNER_TEMP/phase1e2e.test" \
            ./app/service/installation/test/phase1e2e
      - name: Verify signed disconnected upgrade, custody backup and recovery
        run: |
          docker volume create --label "matrix.task=$PLATFORM_DIND" "$PLATFORM_DATA_VOLUME"
          docker volume create --label "matrix.task=$PLATFORM_DIND" "$PLATFORM_DOCKER_VOLUME"
          docker run --detach --name "$PLATFORM_DIND" --label "matrix.task=$PLATFORM_DIND" \
            --privileged --cgroupns private --network none --cpus 2 --memory 4g --memory-swap 4g \
            --pids-limit 768 --security-opt label=disable --env DOCKER_TLS_CERTDIR= \
            --mount "type=volume,source=$PLATFORM_DATA_VOLUME,target=/data" \
            --mount "type=volume,source=$PLATFORM_DOCKER_VOLUME,target=/var/lib/docker" \
            --mount "type=bind,source=$RUNNER_TEMP/platform-release-a,target=/releases/a,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/platform-release-b,target=/releases/b,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/platform-release-trust.json,target=/releases/trust.json,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/phase1e2e.test,target=/gate/phase1e2e.test,readonly" \
            docker:27.5.1-dind-alpine3.21 \
            --tls=false --storage-driver=overlay2 --max-concurrent-downloads=1 --max-concurrent-uploads=1
          for attempt in $(seq 1 60); do
            if docker exec "$PLATFORM_DIND" docker info >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$PLATFORM_DIND"
              exit 1
            fi
            sleep 1
          done
          timeout 2100s docker exec \
            --env GOMAXPROCS=2 --env GOMEMLIMIT=512MiB \
            --env MATRIX_PHASE1_E2E=1 --env MATRIX_PHASE1_E2E_PHASE=run \
            --env MATRIX_PHASE1_ROOT=/data/matrix \
            --env MATRIX_PHASE1_RELEASE_A=/releases/a \
            --env MATRIX_PHASE1_RELEASE_B=/releases/b \
            --env MATRIX_PHASE1_TRUST_KEY=/releases/trust.json \
            "$PLATFORM_DIND" /gate/phase1e2e.test -test.v -test.count=1 \
              -test.timeout=30m -test.run='^TestOfflinePhase1Lifecycle$'
          docker restart --time 15 "$PLATFORM_DIND"
          for attempt in $(seq 1 60); do
            if docker exec "$PLATFORM_DIND" docker info >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$PLATFORM_DIND"
              exit 1
            fi
            sleep 1
          done
          timeout 300s docker exec \
            --env GOMAXPROCS=2 --env GOMEMLIMIT=512MiB \
            --env MATRIX_PHASE1_E2E=1 --env MATRIX_PHASE1_E2E_PHASE=after-restart \
            --env MATRIX_PHASE1_ROOT=/data/matrix \
            --env MATRIX_PHASE1_RELEASE_A=/releases/a \
            --env MATRIX_PHASE1_TRUST_KEY=/releases/trust.json \
            "$PLATFORM_DIND" /gate/phase1e2e.test -test.v -test.count=1 \
              -test.timeout=4m -test.run='^TestOfflinePhase1Lifecycle$'
      - name: Remove isolated release-gate resources
        if: always()
        run: |
          docker rm --force "$PLATFORM_DIND" 2>/dev/null || true
          docker volume rm "$PLATFORM_DATA_VOLUME" 2>/dev/null || true
          docker volume rm "$PLATFORM_DOCKER_VOLUME" 2>/dev/null || true
          git worktree remove --force "$RUNNER_TEMP/matrix-platform-predecessor" 2>/dev/null || true
          git worktree prune
