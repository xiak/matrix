name: Verification

on:
  push:
    branches: [main, 'feat/**']
    paths: ['api/**', 'app/**', 'deploy/**', 'test/**', 'go.mod', 'go.sum', '.github/workflows/**']
  pull_request:
    paths: ['api/**', 'app/**', 'deploy/**', 'test/**', 'go.mod', 'go.sum', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Verify dependencies and generation
        run: |
          go mod download
          go mod verify
          go generate ./api/...
          git diff --exit-code -- api
      - name: Unit, architecture and race gates
        run: |
          go vet -p 2 ./...
          go test -race -p 2 ./...

  authority-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_PASSWORD: matrix-authority-ci-test-only
        ports:
          - 5432
        options: >-
          --cpus 1 --memory 768m --pids-limit 192
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The retained-data upgrade gate reads one fixed, accepted Git object.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Create independent gate databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          for database in matrix_authority_ci matrix_audit_upgrade_ci matrix_audit_http_ci \
              matrix_iam_http_ci matrix_authority_process_ci matrix_paas_ci; do
            docker exec "$POSTGRES_CONTAINER_ID" createdb -U postgres "$database"
          done
      - name: PostgreSQL authority, retained-data upgrade and independent-process gates
        env:
          MATRIX_AUTHORITY_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_authority_ci?sslmode=disable
          MATRIX_AUDIT_UPGRADE_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_audit_upgrade_ci?sslmode=disable
          MATRIX_AUDIT_HTTP_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_audit_http_ci?sslmode=disable
          MATRIX_IAM_HTTP_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_iam_http_ci?sslmode=disable
          MATRIX_AUTHORITY_PROCESS_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_authority_process_ci?sslmode=disable
          MATRIX_PAAS_POSTGRES_TEST_DSN: postgres://postgres:matrix-authority-ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matrix_paas_ci?sslmode=disable
        run: |
          go test -race -p 1 -count=1 ./app/service/audit/internal/data/postgres \
            ./app/service/audit/internal/integration ./app/service/iam/internal/integration \
            ./test/authorityprocess ./app/service/paas/internal/apphosting/data/postgres

  node-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_EXPORTER_VERSION: '1.12.1'
      NODE_EXPORTER_SHA256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Prepare the isolated runner's local Docker prerequisites
        run: |
          sudo timeout 30s systemctl start docker
          sudo env -u DOCKER_CONTEXT DOCKER_HOST=unix:///var/run/docker.sock \
            timeout 30s docker info --format '{{.ServerVersion}}'
          sudo timeout 10s docker compose version --short
      - name: Fetch authenticated collector fixture
        run: |
          curl --fail --location --proto '=https' --tlsv1.3 --max-time 90 \
            -o "$RUNNER_TEMP/node_exporter.tar.gz" \
            "https://github.com/prometheus/node_exporter/releases/download/v$NODE_EXPORTER_VERSION/node_exporter-$NODE_EXPORTER_VERSION.linux-amd64.tar.gz"
          echo "$NODE_EXPORTER_SHA256  $RUNNER_TEMP/node_exporter.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/node_exporter.tar.gz" -C "$RUNNER_TEMP" --no-same-owner \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/node_exporter" \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/LICENSE" \
            "node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/NOTICE"
      - name: Build and verify the real Linux node and collector processes
        env:
          MATRIX_NODE_AGENT_REAL_RUNTIME: '1'
          MATRIX_NODE_AGENT_BINARY: ${{ runner.temp }}/matrix-node-agent
        run: |
          go build -p 2 -trimpath -o "$MATRIX_NODE_AGENT_BINARY" ./app/service/nodeagent/cmd/matrix-node-agent
          go test -c -p 2 -o "$RUNNER_TEMP/node-runtime.test" ./app/service/nodeagent/internal/service/nethttp
          sudo env GOMAXPROCS=2 MATRIX_NODE_AGENT_REAL_RUNTIME=1 \
            "MATRIX_NODE_AGENT_BINARY=$MATRIX_NODE_AGENT_BINARY" \
            "MATRIX_NODE_EXPORTER_BINARY=$RUNNER_TEMP/node_exporter-$NODE_EXPORTER_VERSION.linux-amd64/node_exporter" \
            "$RUNNER_TEMP/node-runtime.test" -test.v -test.count=1 -test.timeout=90s -test.run='^TestLinuxNodeProcessObservation$'
