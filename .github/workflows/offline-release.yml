name: Offline release acceptance

on:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Use the protected release signer and prepare a verified draft Release (main only)
        type: boolean
        default: false
      release_version:
        description: Fresh-install release version
        type: string
        default: v0.3.0
      successor_version:
        description: Same-source successor used only for lifecycle acceptance
        type: string
        default: v0.3.1
      accepted_run_id:
        description: With prepare_release, resume publication from this accepted run; leave empty to build and test
        type: string
        default: ''
      https_proxy:
        description: Exercise local HTTPS proxy ingress, first-use browser and lifecycle recovery
        type: boolean
        default: false
  push:
    branches: ['feat/product-onboarding-release']
    # Publication recovery has its own Verification gate. Runtime changes below
    # run cold acceptance automatically; production assembly always runs it.
    paths:
      - 'app/service/installation/test/phase1e2e/**'
      - 'app/service/installation/internal/localmachine/**'
      - 'deploy/cmd/matrix-offline-fixture/**'
      - 'deploy/cmd/matrix-release/**'
      - 'deploy/releasebuild/**'

permissions:
  contents: read

concurrency:
  group: offline-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-offline-lifecycle:
    if: ${{ !inputs.accepted_run_id && (!inputs.prepare_release || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment:
      name: ${{ inputs.prepare_release && 'release' || 'acceptance' }}
      deployment: false
    permissions:
      contents: read
      actions: read
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: '1GiB'
      CGO_ENABLED: '0'
      MATRIX_HTTPS_PROXY: ${{ inputs.https_proxy && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
      - name: Select exact release versions and require accepted source
        env:
          PREPARE_RELEASE: ${{ inputs.prepare_release && 'true' || 'false' }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SUCCESSOR_VERSION: ${{ inputs.successor_version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, runpy
          a, b = 'v0.3.0-products.1', 'v0.3.0-products.2'
          if os.environ['PREPARE_RELEASE'] == 'true':
              a, b = os.environ['RELEASE_VERSION'], os.environ['SUCCESSOR_VERSION']
              version = r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
              if not re.fullmatch(version, a) or not re.fullmatch(version, b):
                  raise SystemExit('release versions must be stable semantic versions')
              if tuple(map(int, b[1:].split('.'))) <= tuple(map(int, a[1:].split('.'))):
                  raise SystemExit('acceptance successor must follow the release version')
              if os.environ['GITHUB_REF'] != 'refs/heads/main':
                  raise SystemExit('production signing requires main')
              require_accepted_source = runpy.run_path('.github/scripts/prepare-release.py')['require_accepted_source']
              require_accepted_source(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'], os.environ['GH_TOKEN'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MATRIX_RELEASE_A_VERSION={a}\nMATRIX_RELEASE_B_VERSION={b}\n')
          PY
      - name: Prepare disposable signed release inputs
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/matrix-offline"
          mkdir -m 700 "$work"
          mkdir "$work/evidence"
          echo "MATRIX_OFFLINE_WORK=$work" >> "$GITHUB_ENV"
          python3 .github/scripts/test_prepare_release.py
          go test -count=1 ./app/service/installation/test/phase1e2e ./deploy/cmd/matrix-offline-fixture
          go build -o "$work/matrix-release" ./deploy/cmd/matrix-release
          go test -c -o "$work/phase1.test" ./app/service/installation/test/phase1e2e
          go test -c -o "$work/releasebuild.test" ./deploy/releasebuild
          go run ./deploy/cmd/matrix-offline-fixture "$work/private"
          docker info --format '{{.ServerVersion}} {{.Driver}} {{json .DriverStatus}}'
          curl --fail --location --retry 3 --output "$work/gvisor.tar.zstd" \
            https://github.com/google/gvisor/releases/download/release-20260831.0/gvisor-x86_64.tar.zstd
          printf '%s  %s\n' b9ccc6e14ca4eb2c2e65ff66e011f3b7e79d3275fb12eab747b19f95caf8e891 "$work/gvisor.tar.zstd" | sha256sum --check
          MATRIX_TEST_RUNNER_TOOLCHAIN=1 go test -count=1 -v \
            -run '^TestLocalRunnerToolchainStagesPinnedOfflineImage$' ./deploy/releasebuild
          sudo sysctl -w vm.max_map_count=1048576
      - name: Create a disposable acceptance signer
        if: ${{ !inputs.prepare_release }}
        shell: bash
        run: |
          set -euo pipefail
          "$MATRIX_OFFLINE_WORK/matrix-release" keygen --key-id offline-acceptance \
            --private-key "$MATRIX_OFFLINE_WORK/private/signer.json" --trust-key "$MATRIX_OFFLINE_WORK/trust.json"
      - name: Load the protected production signing identity
        if: ${{ inputs.prepare_release }}
        env:
          MATRIX_RELEASE_SIGNING_KEY: ${{ secrets.MATRIX_RELEASE_SIGNING_KEY }}
          MATRIX_RELEASE_TRUST_ROOT: ${{ vars.MATRIX_RELEASE_TRUST_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          # Configure these only in the release environment, restricted to main.
          # Assembly validates canonical encoding and the exact key/trust match.
          python3 - <<'PY'
          import os
          root = os.environ['MATRIX_OFFLINE_WORK']
          for variable, relative in (('MATRIX_RELEASE_SIGNING_KEY', 'private/signer.json'), ('MATRIX_RELEASE_TRUST_ROOT', 'trust.json')):
              content = os.environ.get(variable, '').encode()
              if not 0 < len(content) <= 16384:
                  raise SystemExit('protected release signing input is missing or oversized')
              descriptor = os.open(os.path.join(root, relative), os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, 'wb') as output:
                  output.write(content)
          PY
      - name: Prepare the pinned browser before disconnecting acceptance
        shell: bash
        run: |
          set -euo pipefail
          work="$MATRIX_OFFLINE_WORK"
          node --check app/service/installation/test/phase1e2e/browser.mjs
          node --check app/service/installation/test/phase1e2e/https-proxy.mjs
          npm install --prefix "$work/browser" --no-audit --no-fund --ignore-scripts playwright@1.64.1
          PLAYWRIGHT_BROWSERS_PATH="$work/browser/engines" \
            "$work/browser/node_modules/.bin/playwright" install --with-deps --no-shell chromium
      - name: Verify isolated native Docker execution before assembly
        shell: bash
        run: |
          set -euo pipefail
          sudo env MATRIX_OFFLINE_WORK="$MATRIX_OFFLINE_WORK" unshare --net --mount bash -s <<'PROBE'
          set -euo pipefail
          umask 077
          work="$MATRIX_OFFLINE_WORK"
          mount --make-rprivate /
          mkdir "$work/probe-run"
          mount --bind "$work/probe-run" /run
          # The private /run hides the inherited login runtime directory.
          # containerd needs an existing owner-only directory for exec specs.
          export XDG_RUNTIME_DIR=/run/matrix-offline-runtime
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          ip link set lo up
          export DOCKER_HOST=unix:///var/run/docker.sock
          export DOCKER_CONFIG="$work/probe-client"
          printf '{}\n' > "$work/probe-daemon.json"
          dockerd --config-file "$work/probe-daemon.json" --data-root "$work/probe-engine" --exec-root /run/docker \
            --pidfile /run/docker.pid --host "$DOCKER_HOST" --storage-driver overlay2 > "$work/probe-engine.log" 2>&1 &
          engine_pid=$!
          cleanup() {
            kill -TERM "$engine_pid" 2>/dev/null || true
            wait "$engine_pid" || true
            chmod 755 "$work/evidence"
            find "$work/evidence" -maxdepth 1 -type f -exec chmod 644 '{}' +
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if docker info > /dev/null 2>&1; then break; fi
            kill -0 "$engine_pid"
            sleep 1
          done
          docker image load --input "$work/private/postfix.tar" > /dev/null
          fixture_image="$(jq -r .imageId "$work/private/fixture.json")"
          probe_id="$(docker run --detach --network none --label com.xiak.matrix.test=offline-runtime-probe \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETGID --cap-add SETUID \
            --entrypoint sh "$fixture_image" -c 'exec sleep 120')"
          if ! timeout 30s docker exec "$probe_id" true > "$work/probe-exec.txt" 2>&1; then
            # This command only executes `true`; it cannot print image secrets.
            # Strip runtime paths and native identities from its error as well.
            python3 - "$work/probe-exec.txt" > "$work/evidence/native-runtime-error.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read(8192)
          # Keep a closed vocabulary of standard runtime path segments so an
          # absent proc namespace and an absent runtime state file are distinct.
          segments = {'run','var','docker','containerd','daemon','runtime-runc','moby','runc','proc','self','exe','fd','root','ns','pid','mnt','net','ipc','uts','user','cgroup','state.json','config.json','exec.fifo','init.pid','log.json','io.containerd.runtime.v2.task','io.containerd.runtime.v1.linux'}
          text = re.sub(r'/[^\s:\x27";]+', lambda m: '/'.join(p if p in segments or not p else '[redacted]' for p in m.group().split('/')), text)
          text = re.sub(r'\b[0-9a-f]{12,}\b', '[identity]', text)
          print(text)
          PY
            exit 1
          fi
          test "$(docker inspect --format '{{index .Config.Labels "com.xiak.matrix.test"}}' "$probe_id")" = offline-runtime-probe
          docker rm --force "$probe_id" > /dev/null
          printf 'native-container-exec PASSED\n' > "$work/evidence/native-runtime-probe.txt"
          PROBE
      - name: Assemble fresh-install A and its exact successor B
        shell: bash
        run: |
          set -euo pipefail
          work="$MATRIX_OFFLINE_WORK"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          "$work/matrix-release" assemble --repository "$GITHUB_WORKSPACE" \
            --output "$work/release-a" --version "$MATRIX_RELEASE_A_VERSION" --build-id "offline-${GITHUB_RUN_ID}-a" \
            --created-at "$created" --private-key "$work/private/signer.json" --trust-key "$work/trust.json" \
            --gvisor-archive "$work/gvisor.tar.zstd"
          "$work/matrix-release" assemble --repository "$GITHUB_WORKSPACE" \
            --output "$work/release-b" --version "$MATRIX_RELEASE_B_VERSION" --build-id "offline-${GITHUB_RUN_ID}-b" \
            --created-at "$created" --private-key "$work/private/signer.json" --trust-key "$work/trust.json" \
            --gvisor-archive "$work/gvisor.tar.zstd" \
            --previous-id "$(jq -r .release.id "$work/release-a/release.json")" --previous-version "$MATRIX_RELEASE_A_VERSION"
          cp "$work/release-a/release.json" "$work/evidence/release-a.json"
          cp "$work/release-b/release.json" "$work/evidence/release-b.json"
          cp "$work/trust.json" "$work/evidence/trust.json"
          cp "$work/private/fixture.json" "$work/evidence/mail-fixture-identity.json"
      - name: Verify selected product routes and enrollment boundaries
        shell: bash
        run: |
          set -euo pipefail
          work="$MATRIX_OFFLINE_WORK"
          # This uses the online build engine, never the cold acceptance root.
          docker image load --input "$work/release-a/images/apisix.tar" > /dev/null
          # A raw archive load does not create the installer's derived alias.
          # Classic and containerd stores expose different signed identities.
          apisix_identity=''
          for candidate in $(jq -r '.images[] | select(.component == "apisix") | .imageId, .sourceDigest' "$work/release-a/release.json"); do
            if observed="$(docker image inspect "$candidate" --format '{{.Id}}' 2>/dev/null)" && [[ "$observed" == "$candidate" ]]; then
              apisix_identity="$observed"
              break
            fi
          done
          test -n "$apisix_identity"
          MATRIX_APISIX_TLS_TEST_IMAGE="$apisix_identity" go test -count=1 -v \
            -run '^TestAPISIXServesInstallationAuthenticatedEnrollmentTLS$' \
            ./app/service/installation/internal/localmachine
      - name: Verify every signed image on a cold native containerd store
        shell: bash
        run: |
          set -euo pipefail
          sudo env MATRIX_OFFLINE_WORK="$MATRIX_OFFLINE_WORK" unshare --net --mount bash -s <<'IMAGE_STORE'
          set -euo pipefail
          umask 077
          work="$MATRIX_OFFLINE_WORK"
          mount --make-rprivate /
          mkdir "$work/containerd-run"
          mount --bind "$work/containerd-run" /run
          export XDG_RUNTIME_DIR=/run/matrix-offline-runtime
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          ip link set lo up
          export DOCKER_HOST=unix:///var/run/docker.sock
          export DOCKER_CONFIG="$work/containerd-client"
          printf '{"features":{"containerd-snapshotter":true}}\n' > "$work/containerd-daemon.json"
          dockerd --config-file "$work/containerd-daemon.json" --data-root "$work/containerd-engine" --exec-root /run/docker \
            --pidfile /run/docker.pid --host "$DOCKER_HOST" > "$work/containerd-engine.log" 2>&1 &
          engine_pid=$!
          cleanup() {
            result=$?
            kill -TERM "$engine_pid" 2>/dev/null || true
            wait "$engine_pid" || true
            if [[ "$result" == 0 ]]; then
              python3 - "$work" <<'PY'
          import pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          target = (root / 'containerd-engine').resolve()
          assert target.parent == root and target.name == 'containerd-engine'
          shutil.rmtree(target)
          PY
            fi
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if docker info > /dev/null 2>&1; then break; fi
            kill -0 "$engine_pid"
            sleep 1
          done
          python3 - "$work" <<'PY'
          import json, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          def docker(*args):
              result = subprocess.run(['docker', *args], capture_output=True, timeout=240)
              if result.returncode:
                  raise SystemExit('containerd image gate command failed')
              return result.stdout
          assert b'io.containerd.snapshotter.v1' in docker('info', '--format', '{{json .DriverStatus}}')
          manifest = json.loads((root / 'release-a/release.json').read_text())
          checked = []
          for image in manifest['images']:
              docker('image', 'load', '--quiet', '--input', str(root / 'release-a' / image['archivePath']))
              expected = image['sourceDigest']
              actual = docker('image', 'inspect', '--format', '{{.Id}}|{{.Os}}|{{.Architecture}}', expected).decode().strip()
              assert actual == expected + '|linux|amd64', 'archive source identity differs after containerd load'
              docker('image', 'tag', expected, image['localReference'])
              assert docker('image', 'inspect', '--format', '{{.Id}}', image['localReference']).decode().strip() == expected
              checked.append(image['component'])
          paas = next(image for image in manifest['images'] if image['component'] == 'paas')
          docker('run', '--rm', '--network', 'none', '--entrypoint', 'docker', paas['localReference'], 'compose', 'version', '--short')
          (root / 'evidence/containerd-image-load.json').write_text(json.dumps({
              'status': 'PASSED', 'imageStore': 'containerd', 'components': checked,
              'exactArchiveIdentities': True, 'containerExecution': True,
          }) + '\n')
          PY
          export MATRIX_TEST_SAVED_IMAGE_ARCHIVE="$work/release-a/images/apisix.tar"
          export MATRIX_TEST_SOURCE_IMAGE_ID="$(jq -r '.images[] | select(.component == "apisix") | .imageId' "$work/release-a/release.json")"
          export MATRIX_TEST_ARCHIVE_DOCKER_HOST="$DOCKER_HOST"
          "$work/releasebuild.test" -test.v -test.run '^TestSavedArchiveMatchesContainerdIdentity$'
          IMAGE_STORE
      - name: Run cold-cache lifecycle and engine restart without DinD
        shell: bash
        run: |
          set -euo pipefail
          # Only the child native processes enter these namespaces. The runner,
          # build daemon and host networking stay online and unchanged. No
          # container hosts a daemon; the acceptance daemon starts with no data.
          sudo env MATRIX_OFFLINE_WORK="$MATRIX_OFFLINE_WORK" MATRIX_BROWSER_NODE="$(command -v node)" \
            MATRIX_BROWSER_SCRIPT="$GITHUB_WORKSPACE/app/service/installation/test/phase1e2e/browser.mjs" \
            MATRIX_HTTPS_PROXY="$MATRIX_HTTPS_PROXY" \
            MATRIX_HTTPS_PROXY_SCRIPT="$GITHUB_WORKSPACE/app/service/installation/test/phase1e2e/https-proxy.mjs" \
            unshare --net --mount bash -s <<'OFFLINE'
          set -euo pipefail
          umask 077
          work="$MATRIX_OFFLINE_WORK"
          mount --make-rprivate /
          # mx requires private inputs to belong to the installing OS user.
          # These files were prepared by the unprivileged CI build user.
          chown -R root:root "$work/private"
          mkdir "$work/run"
          mount --bind "$work/run" /run
          export XDG_RUNTIME_DIR=/run/matrix-offline-runtime
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          # Keep native runtime PID/proc/cgroup observation in the host's PID
          # namespace. Network and filesystem mounts remain private.
          ip link set lo up
          export DOCKER_HOST=unix:///var/run/docker.sock
          export DOCKER_CONFIG="$work/private/docker-client"
          printf '{}\n' > "$work/private/daemon.json"
          start_engine() {
            dockerd --config-file "$work/private/daemon.json" --data-root "$work/engine" --exec-root /run/docker \
              --pidfile /run/docker.pid --host "$DOCKER_HOST" --storage-driver overlay2 \
              > "$work/private/engine.log" 2>&1 &
            engine_pid=$!
            for attempt in $(seq 1 60); do
              if docker info > /dev/null 2>&1; then return; fi
              kill -0 "$engine_pid"
              sleep 1
            done
            return 1
          }
          stop_engine() {
            kill -TERM "$engine_pid"
            engine_status=0
            wait "$engine_pid" || engine_status=$?
            # A native daemon may report the SIGTERM used for the intentional
            # restart as 143 instead of translating it to a zero exit. Both
            # mean the requested stop completed; every other status still
            # fails the release gate.
            if [[ "$engine_status" != 0 && "$engine_status" != 143 ]]; then
              return "$engine_status"
            fi
          }
          start_https_proxy() {
            "$MATRIX_BROWSER_NODE" "$MATRIX_HTTPS_PROXY_SCRIPT" "$SSL_CERT_FILE" "$work/private/https-key.pem" \
              > "$work/private/https-proxy.log" 2>&1 &
            https_proxy_pid=$!
            for attempt in $(seq 1 30); do
              if curl --silent --max-time 2 --cacert "$SSL_CERT_FILE" "$MATRIX_PHASE1_EDGE/ready" > /dev/null; then return; fi
              kill -0 "$https_proxy_pid"
              sleep 1
            done
            return 1
          }
          cleanup() {
            result=$?
            if [[ -n "${https_proxy_pid:-}" ]]; then kill -TERM "$https_proxy_pid" 2>/dev/null || true; fi
            if [[ "$result" != 0 ]]; then
              docker container ls --all --format '{{.Label "com.xiak.matrix.role"}} {{.State}} {{.Status}}' \
                > "$work/evidence/runtime-health.txt" 2>/dev/null || true
              "$work/release-a/bin/mx" --format json platform status --root "$work/installation" 2>/dev/null \
                | jq '{status, state: .result.state, code: .error.code}' > "$work/evidence/failure-status.json" || true
              df -B1 --output=avail "$work" | tail -1 > "$work/evidence/available-bytes.txt"
              postgres_id="$(docker container ls --all --quiet --filter label=com.xiak.matrix.role=postgres)"
              if [[ "$postgres_id" =~ ^[a-f0-9]{12,64}$ ]]; then
                timeout 10s docker inspect --format '{{json .State.Health}}' "$postgres_id" \
                  | python3 -c 'import json,re,sys; h=json.load(sys.stdin); clean=lambda s: re.sub(r"\b[0-9a-f]{12,}\b", "[identity]", re.sub(r"/[^\s:\x27\";]+", "[path]", s[:4096])); print(json.dumps({"Status":h["Status"], "FailingStreak":h["FailingStreak"], "Log":[{**{k:l[k] for k in ("Start","End","ExitCode")}, "Output":clean(l["Output"])} for l in h["Log"]]}))' \
                  > "$work/evidence/database-health.json" || true
                timeout 10s docker top "$postgres_id" -eo comm > "$work/evidence/database-processes.txt" 2>/dev/null || true
                timeout 10s docker stats --no-stream --format '{{.CPUPerc}} {{.MemUsage}} {{.PIDs}}' "$postgres_id" \
                  > "$work/evidence/database-resources.txt" 2>/dev/null || true
                # Publish only counts of fixed diagnostic phrases. Raw logs,
                # SQL, credentials, native identities and paths remain private.
                timeout 10s docker logs --tail 100 "$postgres_id" 2>&1 \
                  | python3 -c 'import json,sys; s=sys.stdin.read(65536).lower(); phrases=["permission denied","operation not permitted","fatal","panic","out of memory","ready to accept connections","init process complete","initdb","waiting for server to shut down","server started","could not create","could not open","could not bind","no space left","postmaster.pid","creating subdirectories"]; print(json.dumps({p:s.count(p) for p in phrases}))' \
                  > "$work/evidence/database-startup-categories.json" || true
              fi
            fi
            if [[ -n "${engine_pid:-}" ]]; then kill -TERM "$engine_pid" 2>/dev/null || true; fi
            find "$work/evidence" -type d -exec chmod 755 '{}' +
            find "$work/evidence" -type f -exec chmod 644 '{}' +
          }
          trap cleanup EXIT
          start_engine
          export PLAYWRIGHT_BROWSERS_PATH="$work/browser/engines"
          if [[ "$MATRIX_HTTPS_PROXY" == 1 ]]; then
            # Disposable test identity stays private. No production Cloudflare,
            # SSH or SMTP credential is needed or uploaded by this gate.
            openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
              -subj /CN=127.0.0.1 -addext 'subjectAltName=IP:127.0.0.1' \
              -keyout "$work/private/https-key.pem" -out "$work/private/https-cert.pem" \
              > "$work/private/https-generation.log" 2>&1
            export SSL_CERT_FILE="$work/private/https-cert.pem"
            export MATRIX_PHASE1_EDGE=https://127.0.0.1:18443
            export MATRIX_PHASE1_FIRST_USE_BROWSER=1
            export MATRIX_BROWSER_PLAYWRIGHT="$work/browser/node_modules/playwright/index.mjs"
            export MATRIX_BROWSER_FIRST_USE_EVIDENCE="$work/evidence/first-use"
            start_https_proxy
          fi
          export MATRIX_PHASE1_E2E=1 MATRIX_PHASE1_E2E_TIMEOUT=90m
          export MATRIX_PHASE1_ROOT="$work/installation"
          export MATRIX_PHASE1_RELEASE_A="$work/release-a" MATRIX_PHASE1_RELEASE_B="$work/release-b"
          export MATRIX_PHASE1_TRUST_KEY="$work/trust.json"
          export MATRIX_PHASE1_SECURITY_MAIL_CONFIGURATION="$work/private/security-mail.json"
          export MATRIX_PHASE1_SECURITY_MAIL_FIXTURE_ARCHIVE="$work/private/postfix.tar"
          export MATRIX_PHASE1_SECURITY_MAIL_FIXTURE_SHA256="$(jq -r .sha256 "$work/private/fixture.json")"
          export MATRIX_PHASE1_SECURITY_MAIL_FIXTURE_IMAGE_ID="$(jq -r .imageId "$work/private/fixture.json")"
          export MATRIX_PHASE1_E2E_PHASE=run
          "$work/phase1.test" -test.run '^TestOfflinePhase1Lifecycle$' -test.v -test.timeout 92m \
            2>&1 | tee "$work/evidence/lifecycle.log"
          stop_engine
          start_engine
          export MATRIX_PHASE1_E2E_PHASE=after-restart MATRIX_PHASE1_E2E_TIMEOUT=15m
          unset MATRIX_PHASE1_RELEASE_B MATRIX_PHASE1_SECURITY_MAIL_CONFIGURATION
          unset MATRIX_PHASE1_SECURITY_MAIL_FIXTURE_ARCHIVE MATRIX_PHASE1_SECURITY_MAIL_FIXTURE_SHA256 MATRIX_PHASE1_SECURITY_MAIL_FIXTURE_IMAGE_ID
          "$work/phase1.test" -test.run '^TestOfflinePhase1Lifecycle$' -test.v -test.timeout 17m \
            2>&1 | tee "$work/evidence/after-restart.log"
          if [[ "$MATRIX_HTTPS_PROXY" == 1 ]]; then
            kill -TERM "$https_proxy_pid"
            wait "$https_proxy_pid"
            https_proxy_pid=''
            if curl --silent --max-time 3 --cacert "$SSL_CERT_FILE" "$MATRIX_PHASE1_EDGE/ready" > /dev/null; then
              exit 1
            fi
            for action in status verify; do
              timeout 5m "$work/release-a/bin/mx" --format json platform "$action" --root "$work/installation" \
                > "$work/private/proxy-down-$action.json"
              jq --exit-status '.status == "SUCCEEDED" and .result.state == "READY"' \
                "$work/private/proxy-down-$action.json" > /dev/null
            done
            start_https_proxy
            curl --fail --silent --show-error --max-time 5 --cacert "$SSL_CERT_FILE" "$MATRIX_PHASE1_EDGE/ready" > /dev/null
            printf '%s\n' '{"proxyUnavailable":true,"localStatusReady":true,"localVerificationReady":true,"proxyRecovered":true}' \
              > "$work/evidence/https-proxy-recovery.json"
          fi
          export PLAYWRIGHT_BROWSERS_PATH="$work/browser/engines"
          timeout --signal=TERM --kill-after=15s 20m "$MATRIX_BROWSER_NODE" "$MATRIX_BROWSER_SCRIPT" \
            "$work/installation-iam-retention.json" "$work/browser/node_modules/playwright/index.mjs" \
            "$work/evidence/browser" | tee "$work/evidence/browser.log"
          stop_engine
          engine_pid=''
          OFFLINE
      - name: Package the exact accepted release pair
        shell: bash
        run: |
          set -euo pipefail
          cd "$MATRIX_OFFLINE_WORK"
          # A tar archive preserves the signed executable modes. Explicit
          # inputs exclude the disposable signer, SMTP fixture and installed
          # state. Ordinary acceptance uses a disposable key; only the protected
          # main-only dispatch can use the long-lived release identity.
          tar --create --gzip --file offline-release-candidates.tar.gz \
            release-a release-b trust.json
          tar --compare --gzip --file offline-release-candidates.tar.gz
          sha256sum offline-release-candidates.tar.gz > evidence/candidates.sha256
      - name: Prepare downloadable fresh-install delivery
        if: ${{ inputs.prepare_release }}
        shell: bash
        run: |
          set -euo pipefail
          work="$MATRIX_OFFLINE_WORK"
          archive="matrix-${MATRIX_RELEASE_A_VERSION}-linux-amd64.tar.gz"
          mkdir -m 700 "$work/delivery"
          tar --create --gzip --file "$work/$archive" --directory "$work/release-a" .
          tar --compare --gzip --file "$work/$archive" --directory "$work/release-a"
          mkdir -m 700 "$work/transport-verify"
          tar --extract --gzip --file "$work/$archive" --directory "$work/transport-verify"
          tar --compare --gzip --file "$work/$archive" --directory "$work/transport-verify"
          # GitHub limits each Release asset to less than 2 GiB. These are
          # transport chunks of one byte-identical bundle, not installer media.
          split --bytes=1900M --numeric-suffixes=0 --suffix-length=3 \
            "$work/$archive" "$work/delivery/$archive.part-"
          cat "$work/delivery/$archive".part-* | cmp - "$work/$archive"
          cp "$work/trust.json" "$work/delivery/release-trust.json"
          cp "$work/release-a/release.json" "$work/release-a/release.sig" "$work/delivery/"
          # Keep the already-public report and real screenshots with the Release;
          # Actions evidence retention must not erase the delivery's proof.
          python3 - <<'PY'
          import os, pathlib, zipfile
          work = pathlib.Path(os.environ['MATRIX_OFFLINE_WORK'])
          names = ['after-restart.log', 'browser.log', 'browser/report.json', 'candidates.sha256', 'containerd-image-load.json',
                   'lifecycle.log', 'mail-fixture-identity.json', 'native-runtime-probe.txt',
                   'release-a.json', 'release-b.json', 'trust.json']
          names += [f'browser/{product}-{state}.jpg' for product in ('elasticsearch', 'logstash', 'kibana', 'redis')
                    for state in ('install', 'running', 'terminated')]
          if os.environ.get('MATRIX_HTTPS_PROXY') == '1':
              names += ['first-use/report.json', 'first-use/https-first-use-console.jpg', 'https-proxy-recovery.json']
          with zipfile.ZipFile(work / 'delivery/acceptance-evidence.zip', 'x', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  source = work / 'evidence' / name
                  if source.is_symlink() or not source.is_file() or not 0 < source.stat().st_size <= 2 * 1024 * 1024:
                      raise SystemExit('required public release evidence is missing or invalid')
                  archive.write(source, name)
          PY
          (cd "$work" && sha256sum "$archive") > "$work/delivery/bundle.sha256"
          cd "$work/delivery"
          sha256sum "$archive".part-* release-trust.json release.json release.sig bundle.sha256 acceptance-evidence.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          cp SHA256SUMS "$work/evidence/delivery.sha256"
      - name: Retain accepted installation candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-release-candidates
          path: ${{ runner.temp }}/matrix-offline/offline-release-candidates.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain verified Release delivery
        if: ${{ inputs.prepare_release }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-release-delivery
          path: ${{ runner.temp }}/matrix-offline/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Preserve only public gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-release-evidence
          path: ${{ runner.temp }}/matrix-offline/evidence/
          if-no-files-found: warn
          retention-days: 14

  prepare-draft-release:
    needs: native-offline-lifecycle
    if: ${{ always() && !cancelled() && inputs.prepare_release && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && ((inputs.accepted_run_id && needs.native-offline-lifecycle.result == 'skipped') || (!inputs.accepted_run_id && needs.native-offline-lifecycle.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: release
      deployment: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      MATRIX_RELEASE_TRUST_ROOT: ${{ vars.MATRIX_RELEASE_TRUST_ROOT }}
      ACCEPTED_RUN_ID: ${{ inputs.accepted_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download only this run's accepted delivery
        if: ${{ !inputs.accepted_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name offline-release-delivery --dir "$RUNNER_TEMP/delivery"
      - name: Verify delivery and prepare a draft with matching uploaded assets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_prepare_release.py
          if [[ -n "$ACCEPTED_RUN_ID" ]]; then
            python3 .github/scripts/prepare-release.py --resume-run "$ACCEPTED_RUN_ID"
          else
            python3 .github/scripts/prepare-release.py
          fi
